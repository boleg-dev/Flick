name: Release Flick
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check release version and run tests
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version" >&2
            exit 1
          fi
          swift test

      - name: Configure signing and notarization
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          umask 077
          cert="$RUNNER_TEMP/signing.p12"
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$cert" "$key"' EXIT
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$cert"
          printf '%s\n' "$NOTARY_PRIVATE_KEY" > "$key"

          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials DeveloperID-Notary --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"

      - name: Build and notarize universal DMG
        run: NOTARY_KEYCHAIN="$RUNNER_TEMP/release.keychain-db" ./Scripts/release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="dist/Flick-${GITHUB_REF_NAME#v}.dmg"
          gh release create "$GITHUB_REF_NAME" "$dmg" --verify-tag --title "Flick ${GITHUB_REF_NAME#v}" --generate-notes
